name: Terraform Plan / Apply

on:
  pull_request:
    branches:
      - development
    paths:
      - 'infra/**'
  push:
    branches:
      - development
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
      environment:
        description: 'Environment to target (ignored for plan — plan always runs all three)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - production
          - shared

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'plan')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init infra/envs/test
        run: |
          terraform -chdir=infra/envs/test init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=test.tfstate"

      - name: Plan infra/envs/test
        run: |
          terraform -chdir=infra/envs/test plan \
            -no-color \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}" \
            2>&1 | tee /tmp/test_plan.txt

      - name: Init infra/envs/staging
        run: |
          terraform -chdir=infra/envs/staging init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=staging.tfstate"

      - name: Plan infra/envs/staging
        run: |
          terraform -chdir=infra/envs/staging plan \
            -no-color \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}" \
            2>&1 | tee /tmp/staging_plan.txt

      - name: Init infra/envs/production
        run: |
          terraform -chdir=infra/envs/production init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=production.tfstate"

      - name: Plan infra/envs/production
        run: |
          terraform -chdir=infra/envs/production plan \
            -no-color \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}" \
            2>&1 | tee /tmp/production_plan.txt

      - name: Upload plan outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.pull_request.number || github.run_id }}
          path: /tmp/*_plan.txt
          if-no-files-found: ignore

      - name: Post plan comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.issue.number) {
              console.log('No PR associated with this run — plan output is available as a workflow artifact.')
              return
            }
            const fs = require('fs')
            const read = p => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(plan output unavailable)'
            const body = [
              '## Terraform Plan',
              '',
              '### `infra/envs/test`',
              '```',
              read('/tmp/test_plan.txt').trim(),
              '```',
              '',
              '### `infra/envs/staging`',
              '```',
              read('/tmp/staging_plan.txt').trim(),
              '```',
              '',
              '### `infra/envs/production`',
              '```',
              read('/tmp/production_plan.txt').trim(),
              '```',
            ].join('\n')
            if (body.length > 65536) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: `## Terraform Plan\n\nPlan output exceeds the GitHub comment size limit. [View full plan in workflow artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }

  apply-test:
    name: Terraform Apply — test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'apply' && inputs.environment == 'test')
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init infra/envs/test
        run: |
          terraform -chdir=infra/envs/test init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=test.tfstate"

      - name: Apply infra/envs/test
        run: |
          terraform -chdir=infra/envs/test apply \
            -auto-approve \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}"

  apply-staging:
    name: Terraform Apply — staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'apply' && inputs.environment == 'staging'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init infra/envs/staging
        run: |
          terraform -chdir=infra/envs/staging init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=staging.tfstate"

      - name: Apply infra/envs/staging
        run: |
          terraform -chdir=infra/envs/staging apply \
            -auto-approve \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}"

  apply-production:
    name: Terraform Apply — production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'apply' && inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init infra/envs/production
        run: |
          terraform -chdir=infra/envs/production init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=production.tfstate"

      - name: Apply infra/envs/production
        run: |
          terraform -chdir=infra/envs/production apply \
            -auto-approve \
            -input=false \
            -var="acr_login_server=${{ vars.ACR_LOGIN_SERVER }}" \
            -var="acr_id=${{ vars.ACR_ID }}" \
            -var="sso_client_id=${{ vars.SSO_CLIENT_ID }}" \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}"

  apply-shared:
    name: Terraform Apply — shared
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'apply' && inputs.environment == 'shared'
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init infra/shared
        run: |
          terraform -chdir=infra/shared init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate3" \
            -backend-config="key=shared.tfstate"

      - name: Apply infra/shared
        run: |
          terraform -chdir=infra/shared apply \
            -auto-approve \
            -input=false \
            -var="cicd_sp_object_id=${{ vars.CICD_SP_OBJECT_ID }}"

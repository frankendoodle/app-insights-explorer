name: CI — Build, Push, Deploy to TEST

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  id-token: write  # required for OIDC authentication to Azure
  contents: read

jobs:
  build-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build & push Docker image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/app-insights-web
          docker build frontend/ \
            --build-arg NEXT_PUBLIC_API_URL=https://aie-api-test.azurewebsites.net \
            --build-arg NEXT_PUBLIC_BACKEND_API_SECRET=${{ secrets.BACKEND_API_SECRET }} \
            --tag $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm run test

      - name: Build & push Docker image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/app-insights-api
          docker build backend/ --tag $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  deploy:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    environment: test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify infrastructure exists
        run: |
          STATE=$(az webapp show \
            --name aie-api-test \
            --resource-group rg-app-insights-explorer-test \
            --query state -o tsv 2>/dev/null || echo "NotFound")
          if [ "$STATE" = "NotFound" ]; then
            echo "::error::Infrastructure not ready. Run the 'Infrastructure — Terraform Apply' workflow first."
            exit 1
          fi
          echo "Infrastructure verified (App Service state: $STATE)"

      - name: Update API container image
        run: |
          az webapp config container set \
            --name aie-api-test \
            --resource-group rg-app-insights-explorer-test \
            --docker-custom-image-name ${{ vars.ACR_NAME }}.azurecr.io/app-insights-api:${{ github.sha }}

      - name: Update Web container image
        run: |
          az webapp config container set \
            --name aie-web-test \
            --resource-group rg-app-insights-explorer-test \
            --docker-custom-image-name ${{ vars.ACR_NAME }}.azurecr.io/app-insights-web:${{ github.sha }}

      - name: Wait for apps to become healthy
        run: |
          echo "Polling until both App Services respond..."
          for i in $(seq 1 24); do
            API=$(curl -s -o /dev/null -w "%{http_code}" https://aie-api-test.azurewebsites.net/api/environments)
            WEB=$(curl -s -o /dev/null -w "%{http_code}" https://aie-web-test.azurewebsites.net)
            echo "Attempt $i/24 — API: $API  Web: $WEB"
            if [ "$API" != "503" ] && [ "$API" != "000" ] && [ "$WEB" != "503" ] && [ "$WEB" != "000" ]; then
              echo "Both apps are responding."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Apps did not become healthy within 6 minutes."
          exit 1

  smoke-test:
    name: Smoke Test (test)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: |
          chmod +x build-release/scripts/smoke-test.sh
          build-release/scripts/smoke-test.sh \
            "https://aie-web-test.azurewebsites.net" \
            "https://aie-api-test.azurewebsites.net"

name: CI — Build, Push, Deploy to TEST

on:
  push:
    branches:
      - development

permissions:
  id-token: write  # required for OIDC authentication to Azure
  contents: read

jobs:
  build-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build & push Docker image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/app-insights-web
          docker build frontend/ --tag $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm run test

      - name: Build & push Docker image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/app-insights-api
          docker build backend/ --tag $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  terraform-apply-test:
    name: Terraform Apply (test)
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    environment: test
    outputs:
      web_app_name: ${{ steps.tf-output.outputs.web_app_name }}
      api_app_name: ${{ steps.tf-output.outputs.api_app_name }}
      resource_group_name: ${{ steps.tf-output.outputs.resource_group_name }}
      web_app_hostname: ${{ steps.tf-output.outputs.web_app_default_hostname }}
      api_app_hostname: ${{ steps.tf-output.outputs.api_app_default_hostname }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/envs/test
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=app-insights-explorer/test.tfstate"

      - name: Terraform apply
        working-directory: infra/envs/test
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}" -var="acr_name=${{ vars.ACR_NAME }}"

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: infra/envs/test
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          echo "web_app_name=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT
          echo "api_app_name=$(terraform output -raw api_app_name)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "web_app_default_hostname=$(terraform output -raw web_app_default_hostname)" >> $GITHUB_OUTPUT
          echo "api_app_default_hostname=$(terraform output -raw api_app_default_hostname)" >> $GITHUB_OUTPUT

  deploy-api:
    name: Deploy API (test)
    runs-on: ubuntu-latest
    needs: terraform-apply-test
    environment: test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update container image
        run: |
          az webapp config container set \
            --name ${{ needs.terraform-apply-test.outputs.api_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }} \
            --docker-custom-image-name ${{ vars.ACR_NAME }}.azurecr.io/app-insights-api:${{ github.sha }}

      - name: Restart and wait for healthy
        run: |
          az webapp restart \
            --name ${{ needs.terraform-apply-test.outputs.api_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }}
          az webapp wait \
            --name ${{ needs.terraform-apply-test.outputs.api_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }} \
            --updated --timeout 120

  deploy-web:
    name: Deploy Web (test)
    runs-on: ubuntu-latest
    needs: [terraform-apply-test, deploy-api]
    environment: test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update container image
        run: |
          az webapp config container set \
            --name ${{ needs.terraform-apply-test.outputs.web_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }} \
            --docker-custom-image-name ${{ vars.ACR_NAME }}.azurecr.io/app-insights-web:${{ github.sha }}

      - name: Restart and wait for healthy
        run: |
          az webapp restart \
            --name ${{ needs.terraform-apply-test.outputs.web_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }}
          az webapp wait \
            --name ${{ needs.terraform-apply-test.outputs.web_app_name }} \
            --resource-group ${{ needs.terraform-apply-test.outputs.resource_group_name }} \
            --updated --timeout 120

  smoke-test:
    name: Smoke Test (test)
    runs-on: ubuntu-latest
    needs: [terraform-apply-test, deploy-web]
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: |
          chmod +x build-release/scripts/smoke-test.sh
          build-release/scripts/smoke-test.sh \
            "https://${{ needs.terraform-apply-test.outputs.web_app_hostname }}" \
            "https://${{ needs.terraform-apply-test.outputs.api_app_hostname }}"

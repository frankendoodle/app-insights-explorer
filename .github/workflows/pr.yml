name: PR Checks

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Docker image (validate only — not pushed)
        run: |
          docker build frontend/ \
            --tag pr-${{ github.event.pull_request.number }}-web

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm run test

      - name: Build Docker image (validate only — not pushed)
        run: |
          docker build backend/ \
            --tag pr-${{ github.event.pull_request.number }}-api


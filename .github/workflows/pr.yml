name: PR Checks

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Docker image (validate only — not pushed)
        run: |
          docker build frontend/ \
            --tag pr-${{ github.event.pull_request.number }}-web

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm run test

      - name: Build Docker image (validate only — not pushed)
        run: |
          docker build backend/ \
            --tag pr-${{ github.event.pull_request.number }}-api

  terraform-plan:
    name: Terraform Plan (test)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/envs/test
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}"

      - name: Terraform Plan
        id: plan
        if: always()
        working-directory: infra/envs/test
        run: |
          terraform plan -no-color 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}
        env:
          TF_VAR_acr_name: ${{ vars.ACR_NAME }}
          TF_VAR_admin_object_id: ${{ vars.ADMIN_OBJECT_ID }}

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let planOutput;
            try {
              planOutput = fs.readFileSync('infra/envs/test/plan.txt', 'utf8').trim()
                || '_No plan output captured._';
            } catch {
              planOutput = '_Plan output not available — check earlier steps in the workflow log._';
            }
            const max = 60000;
            const body = planOutput.length > max
              ? planOutput.substring(0, max) + '\n\n_(output truncated)_'
              : planOutput;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — test\n<details><summary>Click to expand</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            });

